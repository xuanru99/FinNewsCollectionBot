name: 📡 RSS 财经新闻自动推送

on:
  # 定时触发：每天早上7:30和晚上19:30（北京时间）
  schedule:
    - cron: "30 23 * * *"   # 北京时间 07:30 (UTC 23:30 前一天)
    - cron: "30 11 * * *"   # 北京时间 19:30 (UTC 11:30)

  # 手动触发
  workflow_dispatch:
    inputs:
      test_mode:
        description: "测试模式（不发送微信推送）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  collect-and-summarize:
    name: 收集与推送财经摘要
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        echo "SERVER_CHAN_KEYS=${{ secrets.SERVER_CHAN_KEYS }}" >> $GITHUB_ENV

    - name: Run finance bot
      run: |
        python financebot.py

    - name: Generate timestamp (Beijing Time)
      run: |
        echo "ARCHIVE_DATE=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-${{ env.ARCHIVE_DATE }}
        path: |
          output/*.md
        if-no-files-found: ignore

    - name: Commit archive to repo
      if: always()
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        git fetch origin "${BRANCH}"
        git pull --rebase origin "${BRANCH}" || true
        if [ -z "$(git status --porcelain output/*.md 2>/dev/null || true)" ]; then
          echo "No changes to commit."
          exit 0
        fi
        git add output/*.md
        git commit -m "chore(report): archive ${ARCHIVE_DATE} [skip ci]"
        git push origin "HEAD:${BRANCH}"

    - name: Show result
      if: always()
      run: |
        echo "✅ 财经新闻收集任务完成"
        echo "📅 $(date)"
